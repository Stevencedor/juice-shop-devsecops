# =============================================================================
# Registro de excepciones (riesgo aceptado) - triaje de la ejecución 1.
# Una excepción SOLO es válida si tiene tool, id, justification, owner y expires
# (AAAA-MM-DD, máximo 180 días). Si vence o está incompleta, QG-08 bloquea.
#
# Responsables: Carlos Bernal (Seguridad, Líder técnico), Kevin Morales
# (Desarrollador), Rafael Pachon (DevOps). Un responsable vacío o pendiente bloquea QG-08.
#
# Corregido en código (por eso NO aparece aquí):
#   VULN-002 inyección SQL en routes/login.ts      -> consulta parametrizada
#   VULN-005 imagen base sin versión fija           -> etiqueta + digest
#   VULN-006 Dockerfile sin HEALTHCHECK             -> HEALTHCHECK agregado
#   Pipeline: reporte ZAP no encontrado (QG-07)     -> ruta del artefacto
# =============================================================================
exceptions:

  # --- SECRETOS (Gitleaks) - FALSOS POSITIVOS: datos de prueba o identificadores públicos ---
  - tool: gitleaks
    id: '*'
    path: test/*
    justification: 'Falso positivo: fixtures de pruebas automatizadas (tokens JWT de ejemplo, credenciales de passkey
      de prueba). No dan acceso a ningún servicio real y no se despliegan.'
    owner: Carlos Bernal (Seguridad)
    expires: '2027-01-31'
    ticket: VULN-007
  - tool: gitleaks
    id: '*'
    path: cypress/*
    justification: 'Falso positivo: datos de las pruebas end-to-end de Cypress. Valores ficticios sin acceso a servicios
      reales.'
    owner: Carlos Bernal (Seguridad)
    expires: '2027-01-31'
    ticket: VULN-007
  - tool: gitleaks
    id: '*'
    path: frontend/src/*.spec.ts
    justification: 'Falso positivo: pruebas unitarias del frontend con tokens JWT de ejemplo. No forman parte del
      bundle desplegado.'
    owner: Carlos Bernal (Seguridad)
    expires: '2027-01-31'
    ticket: VULN-007
  - tool: gitleaks
    id: generic-api-key
    path: frontend/src/app/manage-passkeys/passkey-providers.ts
    justification: 'Falso positivo verificado: son AAGUID públicos de proveedores de passkeys (lista pública passkey-authenticator-aaguids).
      Identifican modelos de autenticador; no son credenciales.'
    owner: Carlos Bernal (Seguridad)
    expires: '2027-01-31'
    ticket: VULN-007
  - tool: gitleaks
    id: generic-api-key
    path: frontend/src/app/faucet/faucet.component.ts
    justification: 'Falso positivo verificado: es la dirección pública de un contrato Ethereum (BeeTokenAddress).
      Las direcciones de contrato son públicas por diseño.'
    owner: Carlos Bernal (Seguridad)
    expires: '2027-01-31'
    ticket: VULN-007
  - tool: gitleaks
    id: '*'
    path: evidencias/*
    justification: 'Falso positivo: reportes JSON de los escáneres guardados como evidencia. Los secretos que citan
      ya vienen censurados con asteriscos por Gitleaks y Trivy; no contienen valores reales.'
    owner: Carlos Bernal (Seguridad)
    expires: '2027-01-31'
    ticket: VULN-007

  # --- SECRETOS (Gitleaks) - ACEPTADOS: secretos intencionales del laboratorio ---
  - tool: gitleaks
    id: private-key
    path: lib/insecurity.js
    justification: 'Clave privada RSA de firma JWT, intencional del reto de falsificación de tokens (ST-02, ST-23).
      En producción se rotaría, se retiraría del historial y se movería a un gestor de secretos (ADR-SEC-001). Controles
      compensatorios: despliegue solo en kind efímero dentro del runner, sin datos reales, NetworkPolicy restrictiva
      y contenedor sin privilegios.'
    owner: Carlos Bernal (Seguridad)
    expires: '2027-01-31'
    ticket: VULN-001
  - tool: gitleaks
    id: private-key
    path: '*terraform/networking.tf'
    justification: 'Clave TLS de ejemplo, intencional del reto de clave filtrada en IaC. El directorio terraform no
      se despliega en este pipeline. Controles compensatorios: despliegue solo en kind efímero dentro del runner,
      sin datos reales, NetworkPolicy restrictiva y contenedor sin privilegios.'
    owner: Carlos Bernal (Seguridad)
    expires: '2027-01-31'
    ticket: VULN-001
  - tool: gitleaks
    id: generic-api-key
    path: data/*
    justification: 'Datos semilla de usuarios ficticios del laboratorio (secretos TOTP y respuestas de seguridad usados
      por retos), en la versión actual y en archivos históricos. Controles compensatorios: despliegue solo en kind
      efímero dentro del runner, sin datos reales, NetworkPolicy restrictiva y contenedor sin privilegios.'

      NetworkPolicy restrictiva y contenedor sin privilegios.'
    owner: Carlos Bernal (Seguridad)
    expires: '2027-01-31'
    ticket: VULN-001
  - tool: gitleaks
    id: generic-api-key
    path: server.js
    justification: Archivo eliminado del repositorio en 2014; el valor solo vive en el historial público de upstream.
      Reescribir el historial rompería el fork. Riesgo residual documentado.
    owner: Carlos Bernal (Seguridad)
    expires: '2027-01-31'
    ticket: VULN-001
  - tool: gitleaks
    id: generic-api-key
    path: .travis.yml
    justification: Configuración de CI retirada en 2014; el valor solo vive en el historial público de upstream. Reescribir
      el historial rompería el fork. Riesgo residual documentado.
    owner: Carlos Bernal (Seguridad)
    expires: '2027-01-31'
    ticket: VULN-001
  - tool: gitleaks
    id: private-key
    path: vagrant/*
    justification: Clave insegura por defecto de Vagrant, pública y conocida, subida por error en 2017 y ya eliminada.
      No protege ningún sistema de este proyecto.
    owner: Carlos Bernal (Seguridad)
    expires: '2027-01-31'
    ticket: VULN-001


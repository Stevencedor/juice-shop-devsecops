    justification: 'Misma clave RSA de firma JWT del reto (ST-02, ST-23), en el código fuente y en el compilado build/lib/insecurity.js.
      Confirma que el secreto viaja en el artefacto desplegado. Controles compensatorios: despliegue solo en kind
      efímero dentro del runner, sin datos reales, NetworkPolicy restrictiva y contenedor sin privilegios.'
    owner: Carlos Bernal (Seguridad)
    expires: '2027-01-31'
    ticket: VULN-001
  - tool: trivy-image

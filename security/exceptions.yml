  # --- SAST (Semgrep) - ACEPTADOS: vulnerabilidades intencionales (la de routes/login.ts se CORRIGIÓ) ---
  - tool: semgrep
    id: javascript.sequelize.security.audit.sequelize-injection-express.express-sequelize-injection
    path: routes/search.ts
    justification: 'Inyección SQL UNION intencional del reto unionSqlInjection (ST-06). Se conserva para el laboratorio;
      la corrección es la misma consulta parametrizada aplicada en routes/login.ts. Controles compensatorios: despliegue
      solo en kind efímero dentro del runner, sin datos reales, NetworkPolicy restrictiva y contenedor sin privilegios.'
    owner: Kevin Morales (Desarrollador)
    expires: '2027-01-31'
    ticket: VULN-003
  - tool: semgrep
    id: javascript.lang.security.audit.code-string-concat.code-string-concat
    path: routes/userProfile.ts
    justification: 'Uso de eval intencional del reto SSTI (inyección de plantillas en el nombre de usuario). Amenaza
      no modelada en la Actividad 2: se propone agregarla a la matriz. Controles compensatorios: despliegue solo en
      kind efímero dentro del runner, sin datos reales, NetworkPolicy restrictiva y contenedor sin privilegios.'
    owner: Kevin Morales (Desarrollador)
    expires: '2027-01-31'
    ticket: VULN-012

  # --- IaC (Trivy config) - FALSO POSITIVO y ACEPTADO ---
  - tool: trivy-iac
    id: '*'
    path: data/static/codefixes/*
    justification: 'Falso positivo de alcance: son fragmentos de Terraform que la app muestra como opciones de un
      reto de código. No se aplican a ninguna nube ni forman parte de la infraestructura desplegada.'
    owner: Rafael Pachon (DevOps)
    expires: '2027-01-31'
    ticket: VULN-008
  - tool: trivy-iac
    id: KSV-0014
    path: k8s/deployment.yaml
    justification: 'Juice Shop escribe en logs/, ftp/, data/ e i18n/ al arrancar; un sistema de archivos de solo lectura
      requiere montajes emptyDir validados. Compensan: usuario no root, allowPrivilegeEscalation=false, capabilities
      drop ALL, seccomp RuntimeDefault y NetworkPolicy.'
    owner: Rafael Pachon (DevOps)
    expires: '2027-01-31'
    ticket: VULN-009

